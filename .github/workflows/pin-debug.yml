name: pin-debug
on:
  workflow_dispatch:
    inputs:
      pins:
        description: Pin URLs separated by space
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/pin_debug.py ${{ inputs.pins }}
