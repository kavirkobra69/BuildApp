name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Xray core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a xr
          curl -fsSL -o xr/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o xr/xray.zip -d xr
          cp xr/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavirDL
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KavirDL.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest KavirDL.apk --title "KavirDL (latest)" --notes "Latest build" --target "$GITHUB_SHA"
